services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16.14-alpine}
    environment:
      POSTGRES_DB: sqlazy_poc
      POSTGRES_USER: sqlazy
      POSTGRES_PASSWORD: sqlazy
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlazy -d sqlazy_poc"]
      interval: 1s
      timeout: 3s
      retries: 30
    volumes:
      - .:/work:ro
      - sqlazy_pgdata:/var/lib/postgresql/data
    working_dir: /work

volumes:
  sqlazy_pgdata:
